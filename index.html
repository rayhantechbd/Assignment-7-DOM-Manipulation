<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Manipulation</title>
</head>
<body>
  <h1 id="heading">Assignment on Module 7</h1>
  <p id="description">Welcome to my website</p>
  <button id="changeButton" type="button">Change Text</button>

  <hr>

  <button id="showMessageButton" type="button">Show Message</button>
  <p id="message"></p>

  <hr>

  <p>Counter: <span id="counter">0</span></p>
  <button id="startButton" type="button">Start</button>
  <button id="stopButton" type="button">Stop</button>

  <hr>

  <div id="callbackOutput"></div>

  <script>
    const heading = document.getElementById("heading");
    const paragraph = document.querySelector("#description");
    const button = document.getElementById("changeButton");
    const showMessageButton = document.getElementById("showMessageButton");
    const message = document.getElementById("message");
    const counter = document.getElementById("counter");
    const startButton = document.getElementById("startButton");
    const stopButton = document.getElementById("stopButton");
    const callbackOutput = document.getElementById("callbackOutput");

    let count = 0;
    let intervalId = null;

    button.addEventListener("click", function () {
      heading.textContent = "Hello JavaScript";
      paragraph.textContent = "DOM Manipulation is Easy!";
      heading.style.color = "blue";
    });

    showMessageButton.addEventListener("click", function () {
      setTimeout(function () {
        message.textContent = "Hello! 2 seconds completed.";
      }, 2000);
    });

    startButton.addEventListener("click", function () {
      if (intervalId === null) {
        intervalId = setInterval(function () {
          count++;
          counter.textContent = count;
        }, 1000);
      }
    });

    stopButton.addEventListener("click", function () {
      clearInterval(intervalId);
      intervalId = null;
    });

    function greet(name, callback) {
      const greeting = document.createElement("p");
      greeting.textContent = "Hello " + name;
      callbackOutput.appendChild(greeting);

      callback();
    }

    function callbackFunction() {
      const welcomeMessage = document.createElement("p");
      welcomeMessage.textContent = "Welcome to JavaScript";
      callbackOutput.appendChild(welcomeMessage);
    }

    greet("Amit", callbackFunction);
  </script>
</body>
</html>
